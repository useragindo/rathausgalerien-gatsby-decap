                  name: eyebrow,
                  widget: string,
                  required: false,
                }
              - {
                  label: Heading,
                  name: heading,
                  widget: string,
                  required: false,
                }
              - {
                  label: Subheading,
                  name: subheading,
                  widget: text,
                  required: false,
                }
              - label: Primary Image
                name: primaryImage
                widget: object
                required: false
                collapsed: true
                fields:
                  - {
                      label: Image,
                      name: image,
                      widget: image,
                      required: false,
                    }
                  - {
                      label: Alternative Text,
                      name: alt,
                      widget: string,
                      required: false,
                    }
              - label: Icon
                name: icon
                widget: object
                required: false
                collapsed: true
                fields:
                  - {
                      label: Icon Name,
                      name: name,
                      widget: string,
                      required: false,
                    }
                  - {
                      label: Screenreader Label,
                      name: ariaLabel,
                      widget: string,
                      required: false,
                    }
              - label: Statistics
                name: stats
                widget: list
                required: false
