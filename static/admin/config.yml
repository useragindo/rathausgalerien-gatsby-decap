              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - {
                  label: Language,
                  name: language,
                  widget: select,
                  options: [de, en],
                  default: de,
                }
              - {
                  label: Open in new tab,
                  name: openInNewTab,
                  widget: boolean,
