backend:
  name: git-gateway
  branch: main

# Enables local editing with the Decap local backend proxy.
# Start it with: npm run cms:proxy
local_backend: true

site_url: /
display_url: /
logo_url: /icon.png
locale: de

media_folder: static/uploads
public_folder: /uploads
publish_mode: editorial_workflow

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

editor:
  preview: false

collections:
  - name: settings
    label: Website Settings
    files:
      - name: site
        label: Website Settings
        file: content/settings/site.yml
        fields:
          - {
              label: Site Title,
              name: siteTitle,
              widget: string,
              required: false,
            }
          - {
              label: Site Description,
              name: siteDescription,
              widget: text,
              required: false,
            }
          - { label: Site URL, name: siteUrl, widget: string, required: false }
          - label: Default Open Graph Image
            name: defaultOgImage
            widget: object
            collapsed: false
            required: false
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - {
                  label: Alternative Text,
                  name: alt,
                  widget: string,
                  required: false,
                }
          - label: Default Language
            name: defaultLanguage
            widget: select
            options:
              - { label: Deutsch, value: de }
              - { label: English, value: en }
            default: de
          - label: Available Languages
            name: availableLanguages
            widget: list
            collapsed: false
            fields:
              - label: Language Code
                name: code
                widget: select
                options:
                  - { label: Deutsch, value: de }
                  - { label: English, value: en }
              - { label: Label, name: label, widget: string, required: false }
          - {
              label: Contact Email,
              name: contactEmail,
              widget: string,
              required: false,
            }
          - { label: Phone, name: phone, widget: string, required: false }
          - label: Address
            name: address
            widget: object
            collapsed: false
            required: false
            fields:
              - { label: Street, name: street, widget: string, required: false }
              - {
                  label: Postal Code,
                  name: postalCode,
                  widget: string,
                  required: false,
                }
              - { label: City, name: city, widget: string, required: false }
              - {
                  label: Country,
                  name: country,
                  widget: string,
                  required: false,
                }
          - label: Social Links
            name: socialLinks
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - { label: Icon, name: icon, widget: string, required: false }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
                }

  - name: navigation
    label: Navigation
    files:
      - name: main
        label: Navigation
        file: content/navigation/main.yml
        fields:
          - label: Main Navigation
            name: mainNavigation
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - {
                  label: Language,
                  name: language,
                  widget: select,
                  options: [de, en],
                  default: de,
                }
              - {
                  label: Open in new tab,
                  name: openInNewTab,
                  widget: boolean,
                  default: false,
                  required: false,
                }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
                }
          - label: Footer Navigation
            name: footerNavigation
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - {
                  label: Language,
                  name: language,
                  widget: select,
                  options: [de, en],
                  default: de,
                }
              - {
                  label: Open in new tab,
                  name: openInNewTab,
                  widget: boolean,
                  default: false,
                  required: false,
                }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
                }
          - label: Utility Navigation
            name: utilityNavigation
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - {
                  label: Language,
                  name: language,
                  widget: select,
                  options: [de, en],
                  default: de,
                }
              - {
                  label: Open in new tab,
                  name: openInNewTab,
                  widget: boolean,
                  default: false,
                  required: false,
                }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
                }
          - label: Social Links
            name: socialLinks
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - { label: Icon, name: icon, widget: string, required: false }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
                }

  - name: pages
    label: Pages
    label_singular: Page
    folder: content/pages
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [title, slug]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string }
      - {
          label: Language,
          name: language,
          widget: select,
          options: [de, en],
          default: de,
        }
      - label: Translations
        name: translations
        widget: list
        required: false
        fields:
          - {
              label: Language,
              name: language,
              widget: select,
              options: [de, en],
            }
          - { label: Slug, name: slug, widget: string, required: false }
      - { label: SEO Title, name: seoTitle, widget: string, required: false }
      - {
          label: SEO Description,
          name: seoDescription,
          widget: text,
          required: false,
        }
      - {
          label: Canonical URL,
          name: canonicalUrl,
          widget: string,
          required: false,
        }
      - label: Open Graph
        name: openGraph
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Title, name: title, widget: string, required: false }
          - {
              label: Description,
              name: description,
              widget: text,
              required: false,
            }
          - { label: Image, name: image, widget: image, required: false }
          - {
              label: Image Alt Text,
              name: imageAlt,
              widget: string,
              required: false,
            }
      - {
          label: Structured Data,
          name: structuredData,
          widget: code,
          default_language: json,
          required: false,
        }
      - label: Hero
        name: hero
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Heading, name: heading, widget: string, required: false }
          - { label: Text, name: text, widget: text, required: false }
          - { label: Image, name: image, widget: image, required: false }
          - {
              label: Image Alt Text,
              name: imageAlt,
              widget: string,
              required: false,
            }
          - {
              label: Screenreader Label,
              name: ariaLabel,
              widget: string,
              required: false,
            }
      - label: Content Blocks
        name: contentBlocks
        widget: list
        required: false
        types:
          - label: Text Block
            name: textBlock
            widget: object
            fields:
              - {
                  label: Heading,
                  name: heading,
                  widget: string,
                  required: false,
                }
              - {
                  label: Content,
                  name: content,
                  widget: markdown,
                  required: false,
                }
          - label: Image Block
            name: imageBlock
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - {
                  label: Alternative Text,
                  name: alt,
                  widget: string,
                  required: false,
                }
              - {
                  label: Caption,
                  name: caption,
                  widget: string,
                  required: false,
                }
          - label: Call To Action
            name: callToAction
            widget: object
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
                }
      - { label: Published, name: published, widget: boolean, default: false }

