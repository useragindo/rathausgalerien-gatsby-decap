backend:
  name: git-gateway
  branch: main

# Enables local editing with the Decap local backend proxy.
# Start it with: npm run cms:proxy
local_backend: true

site_url: /
display_url: /
logo_url: /media/locations/_rathausgalerien.svg
locale: de

media_folder: static/media
public_folder: /media

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

editor:
  preview: false

collections:
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "content/pages"
    media_folder: "/static/media/pages"
    public_folder: "/media/pages"
    path: "{{locale}}/{{slug}}"
    identifier_field: key
    summary: "{{key}} ({{locale}})"
    view_filters:
      - label: "Deutsch"
        field: locale
        pattern: "de"
      - label: "English"
        field: locale
        pattern: "en"
    create: true
    sortable_fields:
      - order
      - key
      - locale
    editor:
      preview: false
    fields:
      - label: "Sprache"
        name: "locale"
        widget: "select"
        default: "de"
        options:
          - { label: "Deutsch", value: "de" }
          - { label: "English", value: "en" }

      - { label: "Type", name: "type", widget: "hidden", default: "page" }

      - label: "Key / Slug"
        name: "key"
        widget: "string"
        hint: "Eindeutiger Schlüssel und Dateiname. Bestimmt die URL, sofern keine SEO-URL gesetzt ist. Bei den Spezialseiten (index, brands, culinary, locations, jobs) nicht ändern."
        pattern: ["^[a-z0-9-]+$", "Nur a-z, 0-9, -"]

      - label: "Template"
        name: "template"
        widget: "select"
        default: "standard"
        hint: "Bestimmt das Layout/Design der Seite."
        options:
          - { label: "Standardseite", value: "standard" }
          - { label: "Startseite", value: "home" }
          - { label: "Shops-Übersicht", value: "shops" }
          - { label: "Gastronomie-Übersicht", value: "gastronomie" }
          - { label: "Lageplan", value: "lageplan" }
          - { label: "Jobs", value: "jobs" }
          - { label: "News-Übersicht", value: "news_list" }
          - { label: "Services-Übersicht", value: "services" }

      - label: "Menü"
        name: "menu"
        widget: "select"
        required: false
        default: ""
        hint: "Ob/wo die Seite in der Navigation erscheint."
        options:
          - { label: "– keines –", value: "" }
          - { label: "Hauptmenü", value: "main" }
          - { label: "Sonstiges (Footer)", value: "misc" }

      - {
          label: "Reihenfolge",
          name: "order",
          widget: "number",
          required: false,
          default: 1,
          value_type: "int",
        }

      - {
          label: "Heading",
          name: "heading",
          widget: "text",
          required: false,
          hint: "Sichtbarer Titel der Seite (H1). Wird auch als SEO-Titel verwendet, falls dieser leer bleibt. Für einen manuellen Zeilenumbruch Enter drücken.",
        }

      - {
          label: "Intro",
          name: "intro",
          widget: "text",
          required: false,
          hint: "Sichtbare Einleitung unter dem Titel. Leer lassen, um hier keinen Text anzuzeigen (kein Fallback von SEO-Description). Für einen manuellen Zeilenumbruch Enter drücken.",
        }

      - label: "SEO"
        name: "seo"
        widget: object
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Description",
              name: "description",
              widget: "string",
              hint: "Reines SEO-Feld. Leer lassen, um Heading und Intro zu übernehmen.",
            }
          - label: "URL"
            name: "url"
            widget: "string"
            required: false
            hint: "Erscheint in der Adressleiste. Leer lassen für Standardseiten ohne eigene URL."
            pattern: ["^$|^[a-z0-9-]+$", "Nur a-z, 0-9, -"]
          - label: "Image (OpenGraph/Twitter)"
            name: "image"
            widget: "image"
            required: false
            hint: "Bild fuer Social-Shares. Fallback: Teaser-Bild, sonst erstes Block-Bild."
          - { label: "Image Alt-Text", name: "imageAlt", widget: "string", required: false }
          - label: "OG Type"
            name: "ogType"
            widget: "select"
            default: "website"
            required: false
            options:
              - { label: "Website", value: "website" }
              - { label: "Article", value: "article" }
          - label: "Twitter Card"
            name: "twitterCard"
            widget: "select"
            default: "summary_large_image"
            required: false
            options:
              - { label: "Summary Large Image", value: "summary_large_image" }
              - { label: "Summary", value: "summary" }
          - label: "noindex"
            name: "noIndex"
            widget: "boolean"
            default: false
            required: false
            hint: "Verhindert Indexierung durch Suchmaschinen."

      - label: "Content"
        name: "body"
        required: false
        widget: "markdown"
        buttons:
          - bold
          - italic
          - quote
          - link
          - heading-two
          - bulleted-list
          - numbered-list

      - label: "Blocks"
        name: "blocks"
        widget: list
        required: false
        identifier_field: header
        hint: "Nur für die Startseite (Template 'Startseite')."
        fields:
          - label: "Header"
            name: "header"
            widget: text
            required: false
            hint: "Für einen manuellen Zeilenumbruch Enter drücken."
          - label: "Anrisstext"
            name: "teaserText"
            widget: text
            required: false
            hint: "Wird unterhalb des Headers angezeigt. Für einen manuellen Zeilenumbruch Enter drücken."
          - label: "Layout"
            name: "layout"
            widget: "select"
            default: "grid-4"
            options:
              - { label: "4er Grid", value: "grid-4" }
              - { label: "Text + Bild (2 Spalten)", value: "columns" }
          - label: "Farbe (aus dem Farbschema)"
            name: "color_token"
            widget: "color-token-select"
            required: false
            default: ""
            options:
              - { label: "– keine –", value: "" }
              - { label: "Hintergrund (bg)", value: "bg", color: "#d1efff" }
              - { label: "Text (text)", value: "text", color: "#22254e" }
              - { label: "Farbe 1 (c1)", value: "c1", color: "#7bd0e5" }
              - { label: "Farbe 2 (c2)", value: "c2", color: "#ffa4cc" }
              - { label: "Farbe 3 (c3)", value: "c3", color: "#ffbb33" }
              - { label: "Farbe 4 (c4)", value: "c4", color: "#b58ec1" }
            hint: "Farbe aus dem aktiven Schema (siehe Einstellungen). Überschreibt die Hintergrundfarbe."
          - label: "Umgekehrt (Bild links, Text rechts)"
            name: "reversed"
            widget: boolean
            default: false
            required: false
            hint: "Nur für 'Text + Bild (2 Spalten)'. Standard: Text links, Bild rechts."
          - label: "Images"
            name: "images"
            widget: list
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                hint: "Bild hier direkt hochladen/auswaehlen (nicht ueber die globale Medien-Ansicht oben, sonst landet es im falschen Ordner)."
              - label: "Text"
                name: "text"
                widget: "string"
                required: false
          - label: "Tiles"
            name: "tiles"
            widget: list
            required: false
            max: 4
            hint: "Bis zu 4 Kacheln in Anzeige-Reihenfolge (z. B. Text, Bild, Text, Bild). Pro Kachel entweder Text ODER Bilder ausfüllen."
            fields:
              - label: "Text"
                name: "text"
                widget: markdown
                required: false
                buttons:
                  - bold
                  - italic
                  - quote
                  - link
                  - heading-two
                  - bulleted-list
                  - numbered-list
              - label: "Bilder"
                name: "images"
                widget: list
                required: false
                hint: "Ein Bild wird wie bisher angezeigt. Bei mehreren Bildern wird die Kachel automatisch als Slider mit Pfeilen dargestellt."
                fields:
                  - label: "Bild"
                    name: "image"
                    widget: "image"
                    hint: "Bild hier direkt hochladen/auswaehlen (nicht ueber die globale Medien-Ansicht oben, sonst landet es im falschen Ordner)."
                  - label: "Alt-Text"
                    name: "alt"
                    widget: "string"
                    required: false
              - label: "Kategorie"
                name: "category"
                widget: relation
                collection: categories
                valueField: uuid
                displayFields:
                  - name
                  - locale
                searchFields:
                  - name
                required: false
                hint: "Wenn gesetzt, wird die Kachel zur Kategorie-Seite verlinkt."
              - label: "Manueller Link"
                name: "link"
                widget: string
                required: false
                hint: "Optionaler Link, der statt der Kategorie verwendet wird."
              - label: "Farbe (aus dem Farbschema)"
                name: "color_token"
                widget: "color-token-select"
                required: false
                default: ""
                options:
                  - { label: "– keine –", value: "" }
                  - { label: "Hintergrund (bg)", value: "bg", color: "#d1efff" }
                  - { label: "Text (text)", value: "text", color: "#22254e" }
                  - { label: "Farbe 1 (c1)", value: "c1", color: "#7bd0e5" }
                  - { label: "Farbe 2 (c2)", value: "c2", color: "#ffa4cc" }
                  - { label: "Farbe 3 (c3)", value: "c3", color: "#ffbb33" }
                  - { label: "Farbe 4 (c4)", value: "c4", color: "#b58ec1" }
                hint: "Nur für Text-Kacheln. Farbe aus dem aktiven Schema (siehe Einstellungen). Überschreibt die Hintergrundfarbe."
              - label: "Hintergrundfarbe"
                name: "backgroundColor"
                widget: color
                required: false
                allowInput: true
                enableAlpha: false
                hint: "Nur für Text-Kacheln. Wird ignoriert, wenn oben eine Schema-Farbe gewählt ist. Wenn beides leer ist, wird automatisch abgewechselt (Blau/Rosa/Gelb/Lila)."
              - label: "Icons"
                name: "icons"
                widget: "list"
                required: false
                hint: "Nur für Text-Kacheln. Werden unterhalb des Texts angezeigt."
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "image"
                    hint: "Bild hier direkt hochladen/auswaehlen (nicht ueber die globale Medien-Ansicht oben, sonst landet es im falschen Ordner)."
                    pattern: ["(?:.+)svg$", "Must be a SVG file"]
                  - label: "Text"
                    name: "text"
                    widget: "string"
                    required: false
                  - label: "Link"
                    name: "link"
                    required: false
                    widget: "string"
                    pattern:
                      [
                        "^(?:\/|https?:\/\/)[A-Za-z0-9-_.\/]+$",
                        "Must start with slash or http(s)://",
                      ]
                    hint: "Provide the URL to a subpage - f.e. /phone - or external URL - f.e. https://www.google.com"
          - label: "Date"
            name: "date"
            default: ""
            widget: datetime
            required: false

      - label: "Teaser"
        name: "teaser"
        widget: object
        required: false
        hint: "Nur für die Templates 'Shops-Übersicht' / 'Gastronomie-Übersicht'."
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - 
            label: "Image"
            name: "image"
            widget: "image"
            required: false
            hint: "Bild hier direkt hochladen/auswaehlen (nicht ueber die globale Medien-Ansicht oben, sonst landet es im falschen Ordner)."

      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        hint: "Nur für das Template 'Lageplan'."
        fields:
          - label: "Image"
            name: "image"
            widget: "image"
            hint: "Bild hier direkt hochladen/auswaehlen (nicht ueber die globale Medien-Ansicht oben, sonst landet es im falschen Ordner)."
          - label: "View ID"
            name: "viewId"
            widget: "string"
            hint: "The ID of the image on the 'Location' site's view."
            pattern:
              ["^foto-(?:[a-z0-9-])+$", "Must be something like f.e. 'foto-1'."]
          - label: "Label"
            name: "label"
            widget: "string"
            required: false

      - label: "Traffic information"
        name: "traffic_information"
        widget: "markdown"
        required: false
        hint: "Nur für das Template 'Lageplan'."
        buttons:
          - bold
          - italic
          - quote
          - link
          - heading-two
          - bulleted-list
          - numbered-list

      - label: "Message"
        name: "message"
        widget: "string"
        required: false
        hint: "Nur für das Template 'Jobs' – wird angezeigt, wenn keine offenen Stellen vorhanden sind."

