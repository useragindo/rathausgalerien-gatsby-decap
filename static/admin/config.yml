  - name: news
    label: News
    label_singular: News Entry
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: mdx
    format: frontmatter
    summary: "{{title}} — {{publishDate}}"
    sortable_fields: [publishDate, title, category]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string }
      - {
          label: Language,
          name: language,
          widget: select,
          options: [de, en],
          default: de,
        }
      - {
          label: Publish Date,
          name: publishDate,
          widget: datetime,
          required: false,
          date_format: DD.MM.YYYY,
          time_format: HH:mm,
          format: YYYY-MM-DDTHH:mm:ss.SSSZ,
