backend:
  name: git-gateway
  branch: main

# Enables local editing with the Decap local backend proxy.
# Start it with: npm run cms:proxy
local_backend: true

site_url: /
display_url: /
logo_url: /media/_rathausgalerien.svg
locale: de

media_folder: static/media
public_folder: /media
publish_mode: editorial_workflow

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

editor:
  preview: false

collections: 

  - name: "pages-de"
    label: "Pages (de)"
    delete: false
    editor: 
      preview: false
    files: 
  
      - file: "content/de/pages/index.md"
        name: "index-de"
        label: "Index"
        fields:
          - { label: "Language", name: "locale", widget: "hidden", default: "de" }
          - { label: "Key", name: "key", widget: "hidden", default: "index" }
          - { label: "Type", name: "type", widget: "hidden", default: "page" }
          - { label: "Menu", name: "menu", widget: "hidden", default: "main" }
          - { label: "Order", name: "order", widget: "hidden", default: 1 }
      
          - label: "SEO"
            name: "seo"
            widget: object
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }

          - label: "Content"
            name: "body"
            required: false
            widget: "markdown"
            buttons:
              - bold
              - italic
              - quote
              - link
              - heading-two
              - bulleted-list
              - numbered-list
      
          - label: "Blocks"
            name: "blocks"
            widget: list
            fields:
              - { label: "Header", name: "header", widget: string }
              - label: "Text"
                name: "text"
                widget: "markdown"
                buttons:
                  - bold
                  - italic
                  - quote
                  - link
                  - heading-two
                  - bulleted-list
                  - numbered-list
              - label: "Images"
                name: "images"
                widget: list
                fields:
                  - label: "Image"
                    name: "image"
                    widget: "image"
                  - label: "Text"
                    name: "text"
                    widget: "string"
                    required: false
              - label: "Date"
                name: "date"
                default: ""
                widget: datetime
                required: false
              - label: "Icons"
                name: "icons"
                widget: "list"
                required: false
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "image"
                    pattern: ["(?:.+)svg$", "Must be a SVG file"]
                  - label: "Text"
                    name: "text"
                    widget: "string"
                    required: false
                  - label: "Link"
                    name: "link"
                    required: false
                    widget: "string"
                    pattern: ["^(?:\/|https?:\/\/)[A-Za-z0-9-_.\/]+$", "Must start with slash or http(s)://"]
                    hint: "Provide the URL to a subpage - f.e. /phone - or external URL - f.e. https://www.google.com"
  
      - file: "content/de/pages/phone/index.md"
        name: "phone-de"
        label: "Phone"
        fields:
          - { label: "Language", name: "locale", widget: "hidden", default: "de" }
          - { label: "Key", name: "key", widget: "hidden", default: "phone" }
          - { label: "Type", name: "type", widget: "hidden", default: "page" }
          - { label: "Menu", name: "menu", widget: "hidden", default: "main" }
          - { label: "Order", name: "order", widget: "hidden", default: 2 }
      
          - label: "SEO"
            name: "seo"
            widget: object
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - label: "URL"
                name: "url"
                widget: "string"
                hint: "Will show up in browser address bar."
                pattern: ["^[a-z0-9-]+$", "Only a-z, 0-9, -"]
      
          - label: "Content"
            name: "body"
            required: false
            widget: "markdown"
            buttons:
              - bold
              - italic
              - quote
              - link
              - heading-two
              - bulleted-list
