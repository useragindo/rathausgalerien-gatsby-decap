backend:
  name: git-gateway
  branch: main

# Enables local editing with the Decap local backend proxy.
# Start it with: npm run cms:proxy
local_backend: true

site_url: /
display_url: /
logo_url: /media/_rathausgalerien.svg
locale: de

media_folder: static/media
public_folder: /media
publish_mode: editorial_workflow

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

editor:
  preview: false

collections:
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "content/pages"
    path: "{{locale}}/{{slug}}"
    identifier_field: key
    summary: "{{key}} ({{locale}})"
    view_filters:
      - label: "Deutsch"
        field: locale
        pattern: "de"
      - label: "English"
        field: locale
        pattern: "en"
    create: true
    sortable_fields:
      - order
      - key
      - locale
    editor:
      preview: false
    fields:
      - label: "Sprache"
        name: "locale"
        widget: "select"
        default: "de"
        options:
          - { label: "Deutsch", value: "de" }
          - { label: "English", value: "en" }

      - { label: "Type", name: "type", widget: "hidden", default: "page" }

      - label: "Key / Slug"
        name: "key"
        widget: "string"
        hint: "Eindeutiger Schlüssel und Dateiname. Bestimmt die URL, sofern keine SEO-URL gesetzt ist. Bei den Spezialseiten (index, brands, culinary, locations, jobs) nicht ändern."
        pattern: ["^[a-z0-9-]+$", "Nur a-z, 0-9, -"]

      - label: "Template"
        name: "template"
        widget: "select"
        default: "standard"
        hint: "Bestimmt das Layout/Design der Seite."
        options:
          - { label: "Standardseite", value: "standard" }
          - { label: "Startseite", value: "home" }
          - { label: "Shops-Übersicht", value: "shops" }
          - { label: "Gastronomie-Übersicht", value: "gastronomie" }
          - { label: "Lageplan", value: "lageplan" }
          - { label: "Jobs", value: "jobs" }

      - label: "Menü"
        name: "menu"
        widget: "select"
        required: false
        default: ""
        hint: "Ob/wo die Seite in der Navigation erscheint."
        options:
          - { label: "– keines –", value: "" }
          - { label: "Hauptmenü", value: "main" }
          - { label: "Sonstiges (Footer)", value: "misc" }

      - {
          label: "Reihenfolge",
          name: "order",
          widget: "number",
          required: false,
          default: 1,
          value_type: "int",
        }

      - label: "SEO"
        name: "seo"
        widget: object
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - label: "URL"
            name: "url"
            widget: "string"
            required: false
            hint: "Erscheint in der Adressleiste. Leer lassen für Standardseiten ohne eigene URL."
            pattern: ["^$|^[a-z0-9-]+$", "Nur a-z, 0-9, -"]

      - label: "Content"
        name: "body"
        required: false
        widget: "markdown"
        buttons:
          - bold
          - italic
          - quote
          - link
          - heading-two
          - bulleted-list
          - numbered-list

      - label: "Blocks"
        name: "blocks"
        widget: list
        required: false
        identifier_field: header
        hint: "Nur für die Startseite (Template 'Startseite')."
        fields:
          - { label: "Header", name: "header", widget: string }
          - label: "Layout"
            name: "layout"
            widget: "select"
            default: "grid-4"
            options:
              - { label: "4er Grid", value: "grid-4" }
              - { label: "Bild links / Text rechts", value: "image-left" }
              - { label: "Text links / Bild rechts", value: "text-left" }
              - { label: "Slider links / Text rechts", value: "slider-left" }
              - { label: "Text links / Slider rechts", value: "slider-right" }
          - label: "Text"
            name: "text"
            widget: "markdown"
            buttons:
              - bold
              - italic
              - quote
              - link
              - heading-two
              - bulleted-list
              - numbered-list
          - label: "Images"
            name: "images"
            widget: list
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Text"
                name: "text"
                widget: "string"
                required: false
          - label: "Tiles"
            name: "tiles"
            widget: list
            required: false
            max: 2
            hint: "2 Reihen mit je 2 Kacheln (links/rechts). Wenn leer, werden die oberen Felder 'Text' und 'Images' verwendet."
            fields:
              - label: "Linke Kachel"
                name: "left"
                widget: object
                required: false
                fields:
                  - label: "Text"
                    name: "text"
                    widget: markdown
                    required: false
                    buttons:
                      - bold
                      - italic
                      - quote
                      - link
                      - heading-two
                      - bulleted-list
                      - numbered-list
                  - label: "Bild"
                    name: "image"
                    widget: "image"
                    required: false
                  - label: "Kategorie"
                    name: "category"
                    widget: relation
                    collection: categories
                    valueField: uuid
                    displayFields:
                      - name
                      - locale
                    searchFields:
                      - name
                    required: false
                    hint: "Wenn gesetzt, wird die Kachel zur Kategorie-Seite verlinkt."
                  - label: "Manueller Link"
                    name: "link"
                    widget: string
                    required: false
                    hint: "Optionaler Link, der statt der Kategorie verwendet wird."
              - label: "Rechte Kachel"
                name: "right"
                widget: object
                required: false
                fields:
                  - label: "Text"
                    name: "text"
                    widget: markdown
                    required: false
                    buttons:
                      - bold
                      - italic
                      - quote
                      - link
                      - heading-two
                      - bulleted-list
                      - numbered-list
                  - label: "Bild"
                    name: "image"
                    widget: "image"
                    required: false
                  - label: "Kategorie"
                    name: "category"
                    widget: relation
                    collection: categories
                    valueField: uuid
                    displayFields:
                      - name
                      - locale
                    searchFields:
                      - name
                    required: false
                    hint: "Wenn gesetzt, wird die Kachel zur Kategorie-Seite verlinkt."
                  - label: "Manueller Link"
                    name: "link"
                    widget: string
                    required: false
                    hint: "Optionaler Link, der statt der Kategorie verwendet wird."
          - label: "Date"
            name: "date"
            default: ""
            widget: datetime
            required: false
          - label: "Icons"
            name: "icons"
            widget: "list"
            required: false
            fields:
              - label: "Icon"
                name: "icon"
                widget: "image"
                pattern: ["(?:.+)svg$", "Must be a SVG file"]
              - label: "Text"
                name: "text"
                widget: "string"
                required: false
              - label: "Link"
                name: "link"
                required: false
                widget: "string"
                pattern:
                  [
                    "^(?:\/|https?:\/\/)[A-Za-z0-9-_.\/]+$",
                    "Must start with slash or http(s)://",
                  ]
                hint: "Provide the URL to a subpage - f.e. /phone - or external URL - f.e. https://www.google.com"

      - label: "Teaser"
        name: "teaser"
        widget: object
        required: false
        hint: "Nur für die Templates 'Shops-Übersicht' / 'Gastronomie-Übersicht'."
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Image", name: "image", widget: "image", required: false }

      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        hint: "Nur für das Template 'Lageplan'."
        fields:
          - label: "Image"
            name: "image"
            widget: "image"
          - label: "View ID"
            name: "viewId"
            widget: "string"
            hint: "The ID of the image on the 'Location' site's view."
            pattern:
              ["^foto-(?:[a-z0-9-])+$", "Must be something like f.e. 'foto-1'."]
          - label: "Label"
            name: "label"
            widget: "string"
            required: false

      - label: "Traffic information"
        name: "traffic_information"
        widget: "markdown"
        required: false
        hint: "Nur für das Template 'Lageplan'."
        buttons:
          - bold
          - italic
          - quote
          - link
          - heading-two
          - bulleted-list
          - numbered-list

      - label: "Message"
        name: "message"
        widget: "string"
        required: false
        hint: "Nur für das Template 'Jobs' – wird angezeigt, wenn keine offenen Stellen vorhanden sind."

  - name: "blocks"
    label: "Blocks"
    label_singular: "Block"
    folder: "content/blocks"
    path: "{{locale}}/{{slug}}"
    identifier_field: name
    summary: "{{name}} ({{locale}})"
    view_filters:
      - label: "Deutsch"
        field: locale
        pattern: "de"
      - label: "English"
        field: locale
        pattern: "en"
    create: true
    editor:
      preview: false
    fields:
      - label: "Sprache"
        name: "locale"
        widget: "select"
        default: "de"
        options:
          - { label: "Deutsch", value: "de" }
          - { label: "English", value: "en" }

      - { label: "Type", name: "type", widget: "hidden", default: "block" }

      - label: "Name"
        name: "name"
        widget: "select"
        options:
          - { label: "General", value: "general" }
          - { label: "Header", value: "header" }
          - { label: "Footer", value: "footer" }
          - { label: "Location", value: "location" }

      - {
          label: "Company Name",
          name: "company_name",
          widget: string,
          required: false,
        }

      - label: "Address Lines"
        name: "address_lines"
        widget: "list"
        required: false
        field: { label: "Line", name: "line", widget: "string" }

      - label: "Social Media"
        name: "social_media"
        widget: "list"
        required: false
        fields:
          - label: "Icon"
            name: "icon"
            widget: "image"
            pattern: ["(?:.+)svg$", "Must be a SVG file"]
          - label: "Link"
            name: "link"
            widget: "string"
            pattern:
              [
                "^(?:\/|https?:\/\/)[A-Za-z0-9-_.\/]+$",
                "Must start with slash or http(s)://",
              ]
            hint: "Provide the URL to a subpage - f.e. /phone - or external URL - f.e. https://www.google.com"

      - {
          label: "Copyright",
          name: "copyright",
          widget: "string",
          required: false,
        }

      - {
          label: "Label Hours",
          name: "label_hours",
          widget: string,
          required: false,
        }

  - name: "categories"
    label: "Categories"
    label_singular: "Category"
    folder: "content/categories"
    path: "{{locale}}/{{slug}}"
    identifier_field: name
    summary: "{{name}} ({{locale}})"
    view_filters:
      - label: "Deutsch"
        field: locale
        pattern: "de"
      - label: "English"
        field: locale
        pattern: "en"
    create: true
    editor:
      preview: false
    fields:
      - label: "Sprache"
        name: "locale"
        widget: "select"
        default: "de"
        options:
          - { label: "Deutsch", value: "de" }
          - { label: "English", value: "en" }

      - { label: "Key", name: "key", widget: "hidden", default: "category" }
      - { label: "Type", name: "type", widget: "hidden", default: "category" }
      - { label: "UUID", name: "uuid", widget: "uuid" }

      - { label: "Name", name: "name", widget: "string" }

  - name: "locations"
    label: "Locations"
    label_singular: "Location"
    folder: "content/locations"
    path: "{{locale}}/{{slug}}"
    identifier_field: name
    summary: "{{name}} ({{locale}})"
    view_filters:
      - label: "Deutsch"
        field: locale
        pattern: "de"
      - label: "English"
        field: locale
        pattern: "en"
    create: true
    editor:
      preview: false
    fields:
      - label: "Sprache"
        name: "locale"
        widget: "select"
        default: "de"
        options:
          - { label: "Deutsch", value: "de" }
          - { label: "English", value: "en" }

      - { label: "Key", name: "key", widget: "hidden", default: "location" }
      - { label: "Type", name: "type", widget: "hidden", default: "location" }
      - { label: "UUID", name: "uuid", widget: "uuid" }

      - label: "SEO"
        name: "seo"
        widget: object
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
            required: false
            hint: "Will use name by default"
          - label: "Description"
            name: "description"
            widget: "string"
          - label: "URL"
            name: "url"
            widget: "string"
            required: false
            hint: "Will use name by default"
            pattern: ["^$|^[a-z0-9-]+$", "Only a-z, 0-9, -"]

      - { label: "Name", name: "name", widget: "string" }

      - label: "Group"
        name: "group"
        widget: "select"
        options:
          - { label: "Brand", value: "brand" }
          - { label: "Culinary", value: "culinary" }

      - label: "Categories"
        name: "categories"
        widget: "relation"
        collection: "categories"
        valueField: "uuid"
        displayFields:
          - "name"
          - "locale"
        searchFields:
          - "name"
        multiple: true
        hint: "Kategorie in der passenden Sprache der Location wählen (Sprache wird in Klammern angezeigt)."

      - { label: "Logo", name: "logo", widget: "image" }

      - label: "Images"
        name: "images"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }

      - label: "Content"
        name: "body"
        widget: "markdown"
        buttons:
          - bold
          - italic
          - quote
          - link
          - heading-two
          - bulleted-list
          - numbered-list

      - label: "Hours"
        name: "hours"
        widget: "list"
        fields:
          - label: "Date"
            name: "date"
            widget: "string"
          - label: "Time"
            name: "time"
            widget: "string"

      - { label: "Address", name: "address", widget: "markdown" }

      - label: "Contact"
        name: "contact"
        widget: object
        fields:
          - label: "Phone"
            name: "phone"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
            hint: "Will use summary by default"
            pattern: ["[^@]+@[^.]+\\..+", "Must be an email address"] # \\ = heredoc, \ = yaml
          - label: "Website"
            name: "url"
            widget: "string"
            required: false
            pattern:
              [
                "^$|(?:https?:\/\/)[a-z0-9-_.\/]+",
                "Must be an URL like https://www.google.com",
              ]

      - label: "View ID"
        name: "viewId"
        widget: "string"
        required: false
        hint: "The ID of the shop on the 'Location' site's view."
        pattern: ["shop-(?:[a-z0-9-])", "Must be something like f.e. 'shop-1'."]

  - name: "jobs"
    label: "Jobs"
    label_singular: "Job"
    folder: "content/jobs"
    path: "{{locale}}/{{slug}}"
    identifier_field: uuid
    summary: "{{location}} - {{position}} ({{locale}})"
    slug: "{{location}}-{{position}}-{{year}}-{{month}}-{{day}}"
    view_filters:
      - label: "Deutsch"
        field: locale
        pattern: "de"
      - label: "English"
        field: locale
        pattern: "en"
    create: true
    editor:
      preview: false
    fields:
      - label: "Sprache"
        name: "locale"
        widget: "select"
        default: "de"
        options:
          - { label: "Deutsch", value: "de" }
          - { label: "English", value: "en" }

      - { label: "Key", name: "key", widget: "hidden", default: "job" }
      - { label: "Type", name: "type", widget: "hidden", default: "job" }
      - { label: "UUID", name: "uuid", widget: "uuid" }

      - label: "SEO"
        name: "seo"
        widget: object
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
            required: false
            hint: "Will use location and position by default"
          - label: "Description"
            name: "description"
            widget: "string"
            required: false
            hint: "Will use specification by default"
          - label: "URL"
            name: "url"
            widget: "string"
            required: false
            hint: "Will use location and position by default"
            pattern: ["^$|^[a-z0-9-]+$", "Only a-z, 0-9, -"]

      - { label: "Location", name: "location", widget: "string" }

      - { label: "Position", name: "position", widget: "string" }

      - { label: "Specification", name: "specification", widget: "string" }

      - label: "Images"
        name: "images"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }

      - label: "Content"
        name: "body"
        widget: "markdown"
        buttons:
          - bold
          - italic
          - quote
          - link
          - heading-two
          - bulleted-list
          - numbered-list
