backend:
  name: git-gateway
  branch: main

# Enables local editing with the Decap local backend proxy.
# Start it with: npm run cms:proxy
local_backend: true

site_url: /
display_url: /
logo_url: /icon.png
locale: de

media_folder: static/uploads
public_folder: /uploads
publish_mode: editorial_workflow

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

editor:
  preview: false

collections:
  - name: settings
    label: Website Settings
    files:
      - name: site
        label: Website Settings
        file: content/settings/site.yml
        fields:
          - {
              label: Site Title,
              name: siteTitle,
              widget: string,
              required: false,
            }
          - {
              label: Site Description,
              name: siteDescription,
              widget: text,
              required: false,
            }
          - { label: Site URL, name: siteUrl, widget: string, required: false }
          - label: Default Open Graph Image
            name: defaultOgImage
            widget: object
            collapsed: false
            required: false
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - {
                  label: Alternative Text,
                  name: alt,
                  widget: string,
                  required: false,
                }
          - label: Default Language
            name: defaultLanguage
            widget: select
            options:
              - { label: Deutsch, value: de }
              - { label: English, value: en }
            default: de
          - label: Available Languages
            name: availableLanguages
            widget: list
            collapsed: false
            fields:
              - label: Language Code
                name: code
                widget: select
                options:
                  - { label: Deutsch, value: de }
                  - { label: English, value: en }
              - { label: Label, name: label, widget: string, required: false }
          - {
              label: Contact Email,
              name: contactEmail,
              widget: string,
              required: false,
            }
          - { label: Phone, name: phone, widget: string, required: false }
          - label: Address
            name: address
            widget: object
            collapsed: false
            required: false
            fields:
              - { label: Street, name: street, widget: string, required: false }
              - {
                  label: Postal Code,
                  name: postalCode,
                  widget: string,
                  required: false,
                }
              - { label: City, name: city, widget: string, required: false }
              - {
                  label: Country,
                  name: country,
                  widget: string,
                  required: false,
                }
          - label: Center Statistics
            name: centerStats
            widget: object
            collapsed: true
            required: false
            fields:
              - {
                  label: Shop Count,
                  name: shopCount,
                  widget: number,
                  value_type: int,
                  required: false,
                }
              - {
                  label: Gastronomy Count,
                  name: gastronomyCount,
                  widget: number,
                  value_type: int,
                  required: false,
                }
          - label: Opening Hours
            name: openingHours
            widget: list
            required: false
            fields:
              - { label: Day, name: day, widget: string, required: false }
              - { label: Opens, name: opens, widget: string, required: false }
              - { label: Closes, name: closes, widget: string, required: false }
              - { label: Note, name: note, widget: string, required: false }
          - label: Parking
            name: parking
            widget: object
            collapsed: true
            required: false
            fields:
              - {
                  label: Spaces,
                  name: spaces,
                  widget: number,
                  value_type: int,
                  required: false,
                }
              - {
                  label: EV Charging Spaces,
                  name: evChargingSpaces,
                  widget: number,
                  value_type: int,
                  required: false,
                }
              - {
                  label: Short Description,
                  name: shortDescription,
                  widget: text,
                  required: false,
                }
          - label: Location
            name: location
            widget: object
            collapsed: true
            required: false
            fields:
              - label: Map Image
                name: mapImage
                widget: object
                collapsed: true
                required: false
                fields:
                  - {
                      label: Image,
                      name: image,
                      widget: image,
                      required: false,
                    }
                  - {
                      label: Alternative Text,
                      name: alt,
                      widget: string,
                      required: false,
                    }
              - {
                  label: Latitude,
                  name: latitude,
                  widget: number,
                  value_type: float,
                  required: false,
                }
              - {
                  label: Longitude,
                  name: longitude,
                  widget: number,
                  value_type: float,
                  required: false,
                }
          - label: Social Links
            name: socialLinks
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - { label: Icon, name: icon, widget: string, required: false }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
                }

