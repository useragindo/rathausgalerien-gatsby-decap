              - { label: URL, name: url, widget: string, required: false }
              - {
                  label: Language,
                  name: language,
                  widget: select,
                  options: [de, en],
                  default: de,
                }
              - {
                  label: Open in new tab,
                  name: openInNewTab,
                  widget: boolean,
                  default: false,
                  required: false,
                }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
                }
          - label: Header Icon Navigation
            name: headerIconNavigation
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
              - { label: Icon, name: icon, widget: string, required: false }
              - {
                  label: Language,
                  name: language,
                  widget: select,
                  options: [de, en],
                  default: de,
                }
              - {
                  label: Open in new tab,
                  name: openInNewTab,
                  widget: boolean,
                  default: false,
                  required: false,
                }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
                  widget: string,
                  required: false,
