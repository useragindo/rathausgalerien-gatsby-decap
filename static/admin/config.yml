  - name: shops
    label: Shops
    label_singular: Shop
    folder: content/shops
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [title, category, order]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string }
      - {
          label: Language,
          name: language,
          widget: select,
          options: [de, en],
          default: de,
        }
      - { label: Category, name: category, widget: string, required: false }
      - {
          label: Short Description,
          name: shortDescription,
          widget: text,
          required: false,
        }
      - {
          label: Description,
          name: description,
          widget: markdown,
          required: false,
        }
      - label: Hero Image
        name: heroImage
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Image, name: image, widget: image, required: false }
          - {
              label: Alternative Text,
              name: alt,
              widget: string,
              required: false,
            }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        fields:
          - { label: Image, name: image, widget: image, required: false }
          - {
              label: Alternative Text,
              name: alt,
              widget: string,
              required: false,
            }
          - { label: Caption, name: caption, widget: string, required: false }
      - label: Opening Hours
        name: openingHours
        widget: list
