              - { label: URL, name: url, widget: string, required: false }
              - {
                  label: Language,
                  name: language,
                  widget: select,
                  options: [de, en],
                  default: de,
                }
              - {
                  label: Open in new tab,
                  name: openInNewTab,
                  widget: boolean,
                  default: false,
                  required: false,
                }
              - {
                  label: Screenreader Label,
                  name: ariaLabel,
