  - name: pages
    label: Pages
    label_singular: Page
    folder: content/pages
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [title, slug]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string }
      - {
          label: Language,
          name: language,
          widget: select,
          options: [de, en],
          default: de,
        }
      - label: Translations
        name: translations
        widget: list
        required: false
        fields:
          - {
              label: Language,
              name: language,
              widget: select,
              options: [de, en],
            }
          - { label: Slug, name: slug, widget: string, required: false }
      - { label: SEO Title, name: seoTitle, widget: string, required: false }
      - {
          label: SEO Description,
          name: seoDescription,
          widget: text,
          required: false,
        }
      - {
          label: Canonical URL,
          name: canonicalUrl,
          widget: string,
          required: false,
        }
      - label: Open Graph
        name: openGraph
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Title, name: title, widget: string, required: false }
          - {
              label: Description,
              name: description,
              widget: text,
              required: false,
            }
          - { label: Image, name: image, widget: image, required: false }
          - {
              label: Image Alt Text,
              name: imageAlt,
              widget: string,
              required: false,
            }
      - {
          label: Structured Data,
          name: structuredData,
          widget: code,
          default_language: json,
          required: false,
        }
      - label: Hero
        name: hero
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Heading, name: heading, widget: string, required: false }
          - { label: Text, name: text, widget: text, required: false }
          - { label: Image, name: image, widget: image, required: false }
          - {
              label: Image Alt Text,
              name: imageAlt,
              widget: string,
              required: false,
            }
          - {
              label: Screenreader Label,
              name: ariaLabel,
              widget: string,
              required: false,
            }
      - label: Content Blocks
        name: contentBlocks
        widget: list
        required: false
        summary: "{{fields.blockTitle}}"
        types:
          - label: Hero Shopping Block
            name: heroShoppingBlock
            widget: object
            fields:
